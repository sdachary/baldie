name: refresh-free-tier

on:
  schedule:
    # Weekly, Monday 06:00 UTC. The upstream lists move slowly; daily burns
    # minutes for near-zero signal. Manual run available below.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: node scripts/refresh-free-tier.js

      - name: Commit registry + changelog if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git status --porcelain | rg -q 'data/'; then
            git config user.name "baldie-bot"
            git config user.email "baldie-bot@users.noreply.github.com"
            git add data/
            git commit -m "data: weekly free-tier registry refresh"
            git push
          else
            echo "no data changes; nothing to commit"
          fi